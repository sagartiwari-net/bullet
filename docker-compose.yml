services:
  checker:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./configs:/app/configs
      - ./wordlists:/app/wordlists
      - ./results:/app/results
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    depends_on:
      - flaresolverr
    restart: unless-stopped
    command: ["./checker", "-addr", ":8080", "-flare", "http://flaresolverr:8191"]

  flaresolverr:
    image: rorqualx/flaresolverr-go:latest
    ports:
      - "8191:8191"
    shm_size: "2gb"
    restart: unless-stopped
